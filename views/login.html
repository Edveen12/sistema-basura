<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
    href="/css/styles.css">

</head>

<body>

<div class="navbar">

    <h2>Sistema Basura</h2>

    <div>

        <a href="/">
            Inicio
        </a>

        <a href="/registro">
            Registrarse
        </a>

    </div>

</div>

<div class="container">

    <h1>Iniciar Sesión</h1>

    <form id="formLogin">

        <input
        type="email"
        id="correo"
        placeholder="Correo"
        required>

        <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required>

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

<script src="/js/app.js"></script>

</body>
</html>
